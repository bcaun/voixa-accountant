<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voixa Exchange</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#/" aria-label="Voixa Exchange home"><img class="on-light" src="/logo.svg" alt="Voixa" width="158" height="26"><img class="on-dark" src="/logo-dark.svg" alt="Voixa" width="158" height="26"><small>Exchange</small></a>
    <div class="right" id="hdrRight"></div>
  </div>
</header>
<main class="view wrap" id="view"><p class="loading">Loading…</p></main>
<div class="scrim" id="scrim" hidden data-act="close-drawer"></div>
<aside class="drawer" id="drawer" hidden aria-label="Details"></aside>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
